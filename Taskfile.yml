version: '3'

dotenv: ['.env']

vars:
  APP_DIR: app

tasks:
  sync:
    desc: Install/refresh the app's uv environment
    dir: "{{.APP_DIR}}"
    sources:
      - pyproject.toml
      - uv.lock
    cmds:
      - uv sync

  invite:
    desc: Print the universal invite link (generates INVITE_TOKEN in .env on first run)
    deps: [sync]
    dir: "{{.APP_DIR}}"
    env:
      TSDFM_RESTART_HINT: "restart 'task dev'"
    cmds:
      - uv run tsdfm-invite

  infra:up:
    desc: Start Icecast + Liquidsoap only (app runs locally instead, see 'dev')
    cmds:
      - docker compose up -d icecast liquidsoap

  infra:down:
    desc: Stop Icecast + Liquidsoap
    cmds:
      - docker compose stop icecast liquidsoap

  infra:logs:
    desc: Tail Icecast + Liquidsoap logs
    cmds:
      - docker compose logs -f icecast liquidsoap

  dev:
    desc: Run the app locally with autoreload, against dockerized Icecast/Liquidsoap
    deps: [sync, infra:up]
    dir: "{{.APP_DIR}}"
    cmds:
      - uv run uvicorn tsdfm.main:app --reload --reload-dir src --host 0.0.0.0 --port 8080

  # PYTHONPATH is cleared because ROS puts itself on the system PYTHONPATH; left
  # set, pytest autoloads its plugins and dies on a missing 'lark'.
  test:
    desc: Run the unit tests (fast, no services needed)
    deps: [sync]
    dir: "{{.APP_DIR}}"
    cmds:
      - PYTHONPATH= uv run pytest tests/unit -q

  test:e2e:
    desc: Run end-to-end tests against a running stack (disruptive - queues real tracks)
    deps: [sync]
    dir: "{{.APP_DIR}}"
    cmds:
      - PYTHONPATH= uv run pytest tests/e2e -q -m e2e

  test:spectrum:
    desc: Check real browser audio analysis with generated tones (Chrome, no live services)
    deps: [sync]
    dir: "{{.APP_DIR}}"
    cmds:
      - PYTHONPATH= uv run python tests/browser/check_spectrum.py

  test:auth:
    desc: Test listener authentication in isolated local containers (requires built tsdfm images)
    deps: [sync]
    dir: "{{.APP_DIR}}"
    cmds:
      - PYTHONPATH= uv run python tests/integration/check_stream_auth.py

  test:all:
    desc: Run unit and e2e tests
    deps: [sync]
    dir: "{{.APP_DIR}}"
    cmds:
      - PYTHONPATH= uv run pytest -q

  build:
    desc: Rebuild the Icecast/Liquidsoap docker images
    cmds:
      - docker compose build

  clean:
    desc: Stop containers and remove the local uv environment
    cmds:
      - docker compose down
      - rm -rf {{.APP_DIR}}/.venv

  deploy:
    desc: Build and (re)start the full stack on the remote NAS, behind Traefik
    dotenv: ['.env.deploy']
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build

  deploy:down:
    desc: Stop the full stack on the remote NAS
    dotenv: ['.env.deploy']
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml down

  deploy:auth:
    desc: Build and apply app/Icecast access control on the NAS (disconnects listeners)
    dotenv: ['.env.deploy']
    cmds:
      - task: deploy:auth:build
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-deps app icecast

  deploy:auth:build:
    desc: Build app and Icecast on the NAS without restarting services
    dotenv: ['.env.deploy']
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml build app icecast

  deploy:auth:verify:
    desc: Read-only public authentication and audio check using the deploy invite
    dir: "{{.APP_DIR}}"
    cmds:
      - PYTHONPATH= uv run python scripts/verify_deploy_auth.py

  deploy:logs:
    desc: Tail logs from the remote NAS deployment
    dotenv: ['.env.deploy']
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml logs -f

  deploy:invite:
    desc: Print the deployed room's invite link (generates DEPLOY_INVITE_TOKEN in .env.deploy on first run)
    deps: [sync]
    dir: "{{.APP_DIR}}"
    dotenv: ['../.env.deploy']
    env:
      TSDFM_ENV_PATH: "{{.ROOT_DIR}}/.env.deploy"
      TSDFM_INVITE_TOKEN_VAR: DEPLOY_INVITE_TOKEN
      TSDFM_RESTART_HINT: "run 'task deploy'"
    cmds:
      - uv run tsdfm-invite

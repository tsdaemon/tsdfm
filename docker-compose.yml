services:
  icecast:
    build: ./icecast
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME}
    restart: unless-stopped

  liquidsoap:
    build: ./liquidsoap
    depends_on:
      - icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
    ports:
      # telnet control channel has no auth - only expose it to the host itself,
      # so a locally-run (non-docker) app process can reach it during dev
      - "127.0.0.1:1234:1234"
    restart: unless-stopped

  app:
    build: ./app
    depends_on:
      - liquidsoap
    environment:
      NAVIDROME_URL: ${NAVIDROME_URL}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD}
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: 1234
      ICECAST_STREAM_URL: ${ICECAST_STREAM_URL}
      INVITE_TOKEN: ${INVITE_TOKEN}
    ports:
      - "8080:8080"
    restart: unless-stopped

services:
  icecast:
    build: ./icecast
    ports:
      - "${ICECAST_PORT:-6491}:${ICECAST_PORT:-6491}"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME}
      ICECAST_PORT: ${ICECAST_PORT:-6491}
      ICECAST_AUTH_URL: http://host.docker.internal:8080/api/stream-auth
      # Set in .env to the app's browser origin (e.g. http://localhost:8080) to
      # let the in-page visualizer read the cross-origin stream. Empty = off.
      ICECAST_CORS_ORIGIN: ${ICECAST_CORS_ORIGIN-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  liquidsoap:
    build: ./liquidsoap
    depends_on:
      - icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      STREAM_BITRATE: ${STREAM_BITRATE:-320}
      ICECAST_PORT: ${ICECAST_PORT:-6491}
    ports:
      # telnet control channel has no auth - only expose it to the host itself,
      # so a locally-run (non-docker) app process can reach it during dev
      - "127.0.0.1:1234:1234"
    restart: unless-stopped
    # The app drives playback over this telnet port and takes a few seconds longer
    # to come up than the app container - so the deploy gates `app` on this
    # (depends_on: condition: service_healthy). bash is the only tool in the image;
    # /dev/tcp is a bash builtin.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/1234"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

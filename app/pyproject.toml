[project]
name = "tsdfm"
version = "0.1.0"
description = "Self-hosted DJ-rotation radio: Navidrome library -> Liquidsoap -> Icecast"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "jinja2==3.1.4",
    "python-dotenv==1.0.1",
]

[project.scripts]
tsdfm-invite = "tsdfm.print_invite:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsdfm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: talks to a running docker stack (deselect with '-m \"not e2e\"')",
]

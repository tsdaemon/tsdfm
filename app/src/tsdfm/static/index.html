<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tsdfm</title>
  <link rel="icon" href="/static/icon/favicon.ico?v={{ asset_version }}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icon/favicon-32x32.png?v={{ asset_version }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icon/favicon-16x16.png?v={{ asset_version }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icon/apple-touch-icon.png?v={{ asset_version }}" />
  <link rel="manifest" href="/static/icon/site.webmanifest?v={{ asset_version }}" />
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}" />
  <script>
    // Apply the saved palette theme before first paint, so there's no flash of
    // the default. app.js is the source of truth for the key and valid values.
    try {
      var t = localStorage.getItem("tsdfm_theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="join-overlay">
    <div id="join-box">
      <strong>tsdfm</strong>
      <p id="join-message">Connecting...</p>
    </div>
  </div>

  <div id="app">
    <nav class="view-tabs" aria-label="Main navigation">
      <img class="brand-logo" src="/static/logo.png?v={{ asset_version }}" alt="tsdfm" width="32" height="32" />
      <button id="room-tab" type="button" aria-pressed="true">Radio room</button>
      <button id="library-tab" type="button" aria-pressed="false">Library</button>
      <button id="nav-now-playing" type="button" hidden title="Back to the Radio room">
        <span class="live-dot" id="nav-live-dot" hidden></span>
        <img id="nav-np-art" alt="" />
        <span id="nav-np-text"></span>
      </button>
      <div class="theme-picker" id="theme-picker">
        <button type="button" class="theme-trigger" id="theme-trigger" aria-haspopup="listbox" aria-expanded="false" title="Colour theme">
          <span class="theme-swatch" id="theme-swatch" aria-hidden="true"></span>
          <span class="theme-trigger-name" id="theme-trigger-name"></span>
        </button>
        <div class="theme-menu" id="theme-menu" role="listbox" aria-label="Colour theme" hidden></div>
      </div>
    </nav>
    <div id="room-main">
      <div class="player-row">
        <div class="panel" id="now-playing">
          <h2><span class="live-dot" id="live-dot" style="display: none;"></span>On Air</h2>
          <div class="np-main">
            <img id="np-art" class="art art-lg" alt="" style="display: none;" />
            <div class="np-info">
              <div class="title" id="np-title">Nothing playing</div>
              <div class="meta" id="np-meta"></div>
            </div>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="np-progress-fill"></div></div>
          <div class="position" id="np-position"></div>
          <div class="player-controls">
            <button id="mute-btn" type="button"></button>
            <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" />
          </div>
          <audio id="radio-audio" src="{{ stream_url }}" preload="none"></audio>
          <div class="row">
            <button id="like-btn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M23,10C23,8.89 22.1,8 21,8H14.68L15.64,3.43C15.66,3.33 15.67,3.22 15.67,3.11C15.67,2.7 15.5,2.32 15.23,2.05L14.17,1L7.59,7.58C7.22,7.95 7,8.45 7,9V19A2,2 0 0,0 9,21H18C18.83,21 19.54,20.5 19.84,19.78L22.86,12.73C22.95,12.5 23,12.26 23,12V10M1,21H5V9H1V21Z" /></svg> <span id="like-count">0</span></button>
            <button id="skip-btn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19,15H23V3H19M15,3H6C5.17,3 4.46,3.5 4.16,4.22L1.14,11.27C1.05,11.5 1,11.74 1,12V14A2,2 0 0,0 3,16H9.31L8.36,20.57C8.34,20.67 8.33,20.77 8.33,20.88C8.33,21.3 8.5,21.67 8.77,21.94L9.83,23L16.41,16.41C16.78,16.05 17,15.55 17,15V5C17,3.89 16.1,3 15,3Z" /></svg> <span id="skip-count">0</span>/<span id="skip-needed">1</span></button>
            <button id="fav-btn" type="button" title="Favourite this track in Navidrome" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5 2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z" /></svg></button>
          </div>
        </div>
      </div>

      <div id="room-scene"></div>

      <div class="panel" id="queue-panel" style="display: none;">
        <h2>My Queue</h2>
        <div class="row">
          <input id="search-input" placeholder="Search your library..." />
          <button id="search-btn" type="button">Search</button>
        </div>
        <div id="search-status" class="meta"></div>
        <div id="search-error" class="error-text"></div>
        <ul id="search-results"></ul>
        <h2>Up next (yours)</h2>
        <ul id="my-queue-list"></ul>
      </div>

      <div class="panel" id="chat-panel">
        <h2>Chat</h2>
        <ul id="chat-log"></ul>
        <div class="row">
          <input id="chat-input" placeholder="Say something..." maxlength="500" />
          <button id="chat-send">Send</button>
        </div>
      </div>
    </div>

    <div id="room-sidebar">
      <div class="panel" id="profile-panel">
        <h2>Profile</h2>
        <div id="profile-display" class="profile-display">
          <span id="profile-avatar" class="profile-avatar"></span>
          <span id="profile-name"></span>
          <button id="profile-edit-btn" type="button" class="icon-btn" title="Change name/avatar"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z" /></svg></button>
        </div>
        <div id="profile-edit-form" style="display: none;">
          <div class="avatar-grid" id="profile-avatar-grid"></div>
          <input id="profile-name-input" placeholder="Your name" maxlength="30" />
          <div class="row">
            <button id="profile-save-btn" type="button">Save</button>
            <button id="profile-cancel-btn" type="button" class="icon-btn">Cancel</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>DJ Booth</h2>
        <ul id="dj-list"></ul>
        <div class="row">
          <button id="dj-toggle">Step up to DJ</button>
        </div>
      </div>

      <div class="panel">
        <h2>Listeners</h2>
        <div id="listeners"></div>
      </div>

      <div class="panel">
        <h2>Recently played</h2>
        <ul id="history-list" tabindex="0" aria-label="Recently played tracks"></ul>
        <nav id="history-pagination" class="row history-pagination" aria-label="Recently played pages" hidden>
          <button id="history-prev" type="button" aria-controls="history-list">Previous</button>
          <span id="history-page" class="meta" role="status"></span>
          <button id="history-next" type="button" aria-controls="history-list">Next</button>
        </nav>
      </div>

      <div class="panel">
        <h2>Logs</h2>
        <ul id="log-panel"></ul>
      </div>
    </div>
    <section id="library-panel" hidden aria-label="Music library">
      <aside id="library-filters" aria-label="Album views"></aside>
      <div class="library-content">
        <h1>Music library</h1>
        <form id="library-search" class="row">
          <input id="library-query" type="search" placeholder="Search albums…" aria-label="Search albums" />
          <button type="submit">Search</button>
        </form>
        <p id="library-status" class="meta" role="status"></p>
        <p id="library-error" class="error-text" role="alert"></p>
        <button id="library-back" type="button" hidden>← Back to albums</button>
        <div id="album-detail"></div>
        <div id="artist-list" hidden></div>
        <ol id="song-list" class="album-tracks" hidden></ol>
        <div id="album-grid" class="album-grid"></div>
        <div class="row library-pagination">
          <button id="library-prev" type="button">Previous</button>
          <span id="library-page" class="meta"></span>
          <button id="library-next" type="button">Next</button>
          <button id="library-refresh" type="button">Refresh</button>
        </div>
      </div>
      <aside id="library-queue" aria-label="Your queue">
        <h2>Your queue</h2>
        <ul id="library-queue-list"></ul>
      </aside>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/static/audio-spectrum.js?v={{ asset_version }}"></script>
  <script src="/static/room-scene.js?v={{ asset_version }}"></script>
  <script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>

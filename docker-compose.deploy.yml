services:
  icecast:
    environment:
      ICECAST_AUTH_URL: http://app:${APP_PORT:-6490}/api/stream-auth
      # Normally unset here: a same-origin deploy (app and /radio.mp3 on one
      # host) needs no CORS. Set it only if the app is served from a different
      # origin than Icecast.
      ICECAST_CORS_ORIGIN: ${ICECAST_CORS_ORIGIN-}

  app:
    build: ./app
    depends_on:
      liquidsoap:
        # Wait for liquidsoap's telnet control port to actually accept connections,
        # not just for its container to start - otherwise room.resume() races it on
        # every redeploy. (resume() tolerates the race now too; this removes it.)
        condition: service_healthy
      piper:
        # DJ breaks are lazy, so this isn't load-bearing - it just avoids a warning
        # window where the toggle is on but the voice service isn't up yet.
        condition: service_started
    environment:
      NAVIDROME_URL: ${NAVIDROME_URL}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD}
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: 1234
      ICECAST_STREAM_URL: ${ICECAST_STREAM_URL}
      # Same key the icecast service reads; lets the app tag the <audio> element
      # for CORS. Unset for a same-origin deploy.
      ICECAST_CORS_ORIGIN: ${ICECAST_CORS_ORIGIN-}
      # Deliberately a different .env key than local dev's INVITE_TOKEN, so the
      # deployed room's invite link can never silently fall back to (or share)
      # your local test room's token - see docs/architecture.md.
      INVITE_TOKEN: ${DEPLOY_INVITE_TOKEN}
      STATS_API_TOKEN: ${STATS_API_TOKEN:-}
      # Named volume, deliberately not a host path - matches the local-dev
      # rule of keeping every writer on its own STATE_PATH.
      STATE_PATH: /data/room-state.json
      # DJ breaks. Inert unless OPENROUTER_API_KEY is set in .env.deploy. The app writes
      # clips to /clips, a named volume the liquidsoap container also mounts. The prompt
      # file lives on the room-state volume so no host bind mount is needed - drop a
      # dj-break-prompt.txt there to override the built-in default.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-openai/gpt-4o-mini,anthropic/claude-3.5-haiku}
      PIPER_URL: http://piper:5000
      DJ_BREAK_CACHE_DIR: /clips
      DJ_BREAK_CLIPS_DIR: /clips
      DJ_BREAK_EVERY_N: ${DJ_BREAK_EVERY_N:-1}
      DJ_BREAK_PROMPT_FILE: /data/dj-break-prompt.txt
    volumes:
      - room-state:/data
      - dj-break-cache:/clips
    ports:
      - "${APP_PORT:-6490}:${APP_PORT:-6490}"
    restart: unless-stopped
    # Configurable (APP_PORT in .env.deploy) rather than the Dockerfile's
    # default 8080, just to keep it visually distinct from other services'
    # internal ports when eyeballing configs - Traefik reaches containers over
    # the docker network either way, so this never actually collides with
    # anything on the host.
    command: ["uvicorn", "tsdfm.main:app", "--host", "0.0.0.0", "--port", "${APP_PORT:-6490}"]
    labels:
      # Discovered by the NAS's Traefik over the docker socket - no shared
      # network needed, see https://github.com/tsdaemon/theseus traefik role.
      # web_local only, not web/websecure+letsencrypt - public HTTPS is
      # Cloudflare's job (Tunnel or proxy in front), not Traefik's, here.
      traefik.enable: "true"
      traefik.http.routers.tsdfm.rule: "Host(`${APP_HOSTNAME_LOCAL}`)"
      traefik.http.routers.tsdfm.entrypoints: "web_local"
      traefik.http.services.tsdfm.loadbalancer.server.port: "${APP_PORT:-6490}"
      # Homepage dashboard tile - queried over the same local route above, so
      # no extra port or network wiring is needed.
      homepage.group: Applications
      homepage.name: tsdfm
      homepage.icon: "${APP_PUBLIC_URL}/static/icon/android-chrome-192x192.png"
      homepage.href: "${APP_PUBLIC_URL}"
      homepage.description: Turntable.fm-style radio for friends
      homepage.widget.type: customapi
      homepage.widget.url: "http://${APP_HOSTNAME_LOCAL}/api/stats"
      homepage.widget.headers.Authorization: "Bearer ${STATS_API_TOKEN:-}"
      homepage.widget.mappings[0].field: connectedusers
      homepage.widget.mappings[0].label: Connected users
      homepage.widget.mappings[0].format: number

  liquidsoap:
    # Base file publishes 127.0.0.1:1234 only for task dev's host-run app to
    # reach it - here app is a container on the same compose network and
    # reaches it by service name (liquidsoap:1234), so drop the publish.
    ports: !reset []
    # Swap the base file's ./dj-break-cache bind mount for the named volume the app
    # container also mounts (deploy keeps every writer off host paths).
    volumes: !override
      - dj-break-cache:/clips

  piper:
    # Only the app talks to it, over the compose network - drop the host publish.
    ports: !reset []

volumes:
  room-state:
  dj-break-cache:
